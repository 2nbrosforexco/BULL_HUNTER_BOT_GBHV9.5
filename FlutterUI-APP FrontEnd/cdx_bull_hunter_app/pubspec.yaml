name: cdx_bull_hunter_app
description: "A new Flutter project for CoinDCX Futures Trading Bot."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP package for API calls (POST/GET)
  http: ^1.2.0
  
  # WebSocket package for real-time live data feeds
  web_socket_channel: ^2.4.0
  
  # Local storage for user registration & persistent session
  shared_preferences: ^2.2.2
  
  # WebView package for TradingView charts integration
  webview_flutter: ^4.4.4
  
  # Web support ke liye compatible version
  webview_flutter_web: ^0.2.3+4

dependency_overrides:
  webview_flutter: ^4.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true